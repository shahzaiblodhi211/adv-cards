<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Advertiser Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF1F7; --surface-3:#E4E8F1;
  --ink:#0C1426; --ink-2:#39435A; --muted:#667089; --line:#E1E5EE; --line-2:#D2D8E4;
  --blue:#1F5FE0; --blue-hover:#174ECB; --blue-soft:#E7EEFD; --blue-ink:#FFFFFF; --blue-text:#1A50C4;
  --orange:#EF7520; --orange-soft:#FDEFE3; --orange-text:#B4560F; --charcoal:#313131;
  --good:#0E8F62; --good-soft:#E2F5EC; --warn:#B26A00; --warn-soft:#FDF1DC; --bad:#D23B3B; --bad-soft:#FCE7E7;
  --shadow:0 1px 2px rgba(12,20,38,.05),0 8px 24px -12px rgba(12,20,38,.12);
  --shadow-lg:0 24px 60px -20px rgba(12,20,38,.35);
  --r:14px; --r-sm:9px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090D16; --surface:#10162A; --surface-2:#161E35; --surface-3:#1E2842;
    --ink:#ECEFF7; --ink-2:#C1C8D8; --muted:#8891A8; --line:#212A42; --line-2:#2C3754;
    --blue:#5A8BFF; --blue-hover:#7AA2FF; --blue-soft:#15244A; --blue-ink:#FFFFFF; --blue-text:#93B2FF;
    --orange:#FF8A3D; --orange-soft:#3A2313; --orange-text:#FFA86E;
    --good:#3CC894; --good-soft:#0F2C22; --warn:#F2A93E; --warn-soft:#33260F; --bad:#F47272; --bad-soft:#3B1719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090D16; --surface:#10162A; --surface-2:#161E35; --surface-3:#1E2842;
  --ink:#ECEFF7; --ink-2:#C1C8D8; --muted:#8891A8; --line:#212A42; --line-2:#2C3754;
  --blue:#5A8BFF; --blue-hover:#7AA2FF; --blue-soft:#15244A; --blue-ink:#FFFFFF; --blue-text:#93B2FF;
  --orange:#FF8A3D; --orange-soft:#3A2313; --orange-text:#FFA86E;
  --good:#3CC894; --good-soft:#0F2C22; --warn:#F2A93E; --warn-soft:#33260F; --bad:#F47272; --bad-soft:#3B1719;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:-.02em}
.brand-name small{display:block;font-family:var(--font);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.ws{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.ws b{font-weight:600;font-size:13px}.ws span{font-size:11.5px;color:var(--muted);display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--blue-soft);color:var(--blue-text);font-weight:600}
.nav a.on svg{color:var(--blue-text)}
.nav .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.promo{border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--orange-soft),var(--blue-soft));border:1px solid var(--line)}
.promo b{font-family:var(--display);font-size:15px;display:block;margin-bottom:2px}
.promo p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px}
.me b{font-size:13px;font-weight:600;display:block}.me span{font-size:11.5px;color:var(--muted)}

.scrim{display:none}
.scrim.open{display:block}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top .menu-btn{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
main{padding:26px 28px 60px;max-width:1320px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{background:var(--blue-hover)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.icon{width:36px;padding:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.inp,.sel{height:38px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 11px;min-width:0;width:100%}
.inp:focus,.sel:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.inp-money{position:relative}.inp-money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}.inp-money .inp{padding-left:22px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
main>.seg{align-self:flex-start}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{max-width:300px;flex:1 1 220px}
.toolbar .sel{width:auto;height:36px}

/* ---------- surfaces ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:700}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:600}
.panel-b{padding:16px 18px 18px}
.grid{display:grid;gap:20px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.link{color:var(--blue-text);font-weight:600;text-decoration:none;background:none;border:0;padding:0;font-size:13px}
.link:hover{text-decoration:underline}

/* hero balance */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;overflow:hidden}
.hero-main{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.hero-main .l svg{width:16px;height:16px}
.hero-main .l{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.big{font-family:var(--display);font-weight:600;font-size:44px;letter-spacing:-.03em;line-height:1}
.big .c{color:var(--muted);font-size:.55em;letter-spacing:0}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hero-rates{border-left:1px solid var(--line);background:var(--surface-2);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.rate{display:flex;align-items:center;gap:12px}
.rate .pct{font-family:var(--display);font-weight:700;font-size:22px;min-width:66px;letter-spacing:-.02em}
.rate .pct.o{color:var(--orange-text)}.rate .pct.b{color:var(--blue-text)}.rate .pct.g{color:var(--good)}
.rate b{font-weight:600;font-size:13.5px;display:block}.rate span{font-size:12px;color:var(--muted)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t .r{text-align:right}
.t tr.group td{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--ink-2);padding:8px 14px}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:10px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--blue-soft);color:var(--blue-text)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:3px;display:inline-block}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:36px;height:36px;font-size:13px}
.minicard{width:40px;height:26px;border-radius:5px;background:linear-gradient(135deg,#0B2A8C,#1F5FE0 60%,#EF7520 140%);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.minicard::after{content:"";position:absolute;left:5px;top:8px;width:8px;height:6px;border-radius:2px;background:rgba(255,255,255,.55)}
.minicard.frozen{background:linear-gradient(135deg,#8C97AE,#B9C2D4)}
.minicard.closed{background:var(--surface-3)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar.hot i{background:var(--orange)}
.bar.full i{background:var(--bad)}

/* action list */
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.act .ic svg{width:17px;height:17px}
.act .ic.bad{background:var(--bad-soft);color:var(--bad)}
.act .ic.warn{background:var(--warn-soft);color:var(--warn)}
.act .ic.info{background:var(--blue-soft);color:var(--blue-text)}
.act .ic.orange{background:var(--orange-soft);color:var(--orange-text)}
.act b{font-weight:600;display:block}
.act p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:normal}
.act .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.act.compact{padding:12px 16px;grid-template-columns:auto minmax(0,1fr)}
.act.compact .btns{grid-column:2;justify-content:flex-start}
.ic-box{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}.ic-box svg{width:17px;height:17px}.ic-box.info{background:var(--blue-soft);color:var(--blue-text)}.ic-box.orange{background:var(--orange-soft);color:var(--orange-text)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-dasharray:4 4}
.chart .dot{fill:var(--blue);stroke:var(--surface);stroke-width:2.5}
.chart .guide{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.chart .hdot{fill:var(--surface);stroke:var(--blue);stroke-width:2.5;opacity:0}
.chart.hover .guide,.chart.hover .hdot{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip b{font-variant-numeric:tabular-nums}
.chart.hover .tip{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;background:var(--blue);display:inline-block;border-radius:2px}
.legend i.cmp{background:none;border-top:2px dashed var(--line-2);height:0}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:12px;align-items:center;font-size:13px}
.hbar .track{height:10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:4px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end;height:170px;padding-top:10px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.col .c{width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--blue-soft);position:relative}
.col.now .c{background:var(--orange)}
.col .c span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.col small{font-size:11.5px;color:var(--muted)}

/* funding */
.fund{display:flex;flex-direction:column;gap:16px}
.fund-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.opt{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:1px}
.opt b{font-size:13px}.opt span{font-size:11.5px;color:var(--muted)}
.opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;background:var(--blue-soft)}
.breakdown{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:4px 14px}
.breakdown div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px dashed var(--line-2);font-variant-numeric:tabular-nums}
.breakdown div:first-child{border-top:0}
.breakdown div.tot{font-weight:700;font-size:15px}
.addr{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.addr svg.qr{width:96px;height:96px;flex:none;background:#fff;border-radius:8px;padding:6px}
.addr .mono{word-break:break-all;font-size:12.5px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:500}
.warnbox svg{width:16px;height:16px;flex:none;margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv>div{padding:11px 14px;border-top:1px solid var(--line);display:flex;align-items:center}
.kv>div:nth-child(-n+3){border-top:0}
.kv .k{color:var(--muted);font-size:12.5px}
.kv .v{font-weight:600;justify-content:flex-end;font-variant-numeric:tabular-nums}
.kv .c{padding-left:0}

/* big card visual */
.vcard{aspect-ratio:1.586;width:100%;max-width:360px;border-radius:18px;padding:20px 22px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 105% 110%,#EF7520 0%,rgba(255,106,19,0) 45%),linear-gradient(140deg,#071A5E 0%,#0F36B8 55%,#1F5FE0 100%);box-shadow:0 20px 40px -18px rgba(13,40,140,.6)}
.vcard.frozen{background:linear-gradient(140deg,#6F7B94,#A8B2C6);box-shadow:none}
.vcard.closed{background:linear-gradient(140deg,#39404F,#5A6275)}
.vcard .t1{display:flex;justify-content:space-between;align-items:flex-start}
.vcard .wm{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.vcard .wm small{display:block;font-family:var(--font);font-weight:500;font-size:10.5px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.vcard .chipg{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#F7D58B,#C9A04B);opacity:.9}
.vcard .pan{font-family:var(--mono);font-size:clamp(15px,4.6vw,19px);letter-spacing:.06em}
.vcard .b1{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;gap:10px}
.vcard .b1 span{display:block;font-size:9.5px;opacity:.7;letter-spacing:.1em;text-transform:uppercase}
.vcard .b1 b{font-family:var(--mono);font-weight:500;font-size:13px}
.vcard .net{font-family:var(--display);font-weight:700;font-style:italic;font-size:15px;opacity:.95}
.vcard .ice{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}

/* overlay */
.ov-scrim{position:fixed;inset:0;background:rgba(6,10,20,.45);z-index:80}.ov-scrim.anim{animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);z-index:81;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-left:1px solid var(--line)}.drawer.anim{animation:slide .2s ease}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 48px);background:var(--surface);z-index:81;border-radius:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border:1px solid var(--line)}.modal.anim{animation:pop .16s ease}
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.modal .ov-h{padding-top:18px}
.ov-h h2{font-size:18px;font-weight:600}
.ov-b{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.ov-b>*{flex-shrink:0}
.ov-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat span{font-size:11.5px;color:var(--muted);display:block}
.stat b{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px;flex:none}
.check b{display:block;font-size:13px}.check .hint{display:block;font-size:12px;color:var(--muted)}
.addr-grid{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:8px}.addr-grid .full{grid-column:1/-1}
.full svg{width:14px;height:14px;vertical-align:-2px}
.switch{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer}.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}.switch i{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);transition:background .15s}.switch i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}.switch input:checked+i{background:var(--blue)}.switch input:checked+i::after{transform:translateX(16px)}.switch input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:13px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-48%);opacity:0}}

#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;animation:pop2 .18s ease}
.toast svg{width:16px;height:16px;color:var(--good)}
@keyframes pop2{from{transform:translateY(8px);opacity:0}}

/* affiliate */
.ref-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);overflow:hidden}
.ref-hero .l{padding:24px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(90% 120% at 0% 0%,var(--orange-soft),transparent 60%)}
.ref-hero h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.ref-hero h2 em{font-style:normal;color:var(--orange-text)}
.ref-link{display:flex;gap:8px;align-items:center;border:1px dashed var(--line-2);border-radius:10px;padding:6px 6px 6px 12px;background:var(--surface)}
.ref-link .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-hero .r{border-left:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s;font-size:13px;color:var(--ink-2)}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);font-weight:700;font-size:12px;color:var(--ink)}
.steps b{color:var(--ink);display:block}
input[type=range]{width:100%;accent-color:var(--orange)}

.logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.logo img{width:24px;height:auto;display:block}
.logo.lg{width:56px;height:56px;border-radius:14px}.logo.lg img{width:38px}
.hide-sm{}
/* application flow */
.ap{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);min-height:100dvh}
.ap-rail{background:radial-gradient(120% 70% at 110% 105%,rgba(239,117,32,.55),transparent 55%),linear-gradient(160deg,#1c1d22 0%,#26272d 55%,#16307a 130%);color:#fff;padding:32px 34px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100dvh;overflow:auto}
.ap-rail h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em;color:#fff}
.ap-props{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ap-props li{font-size:13px;color:rgba(255,255,255,.7);border-left:2px solid #EF7520;padding-left:12px}
.ap-props b{display:block;color:#fff;font-size:14px}
.ap-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ap-steps li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:rgba(255,255,255,.55);padding:5px 0}
.ap-steps li span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.ap-steps li span svg{width:13px;height:13px}
.ap-steps li.on{color:#fff;font-weight:600}.ap-steps li.on span{background:#fff;color:#1c1d22;border-color:#fff}
.ap-steps li.done{color:rgba(255,255,255,.85)}.ap-steps li.done span{background:#EF7520;border-color:#EF7520;color:#fff}
.ap-foot{margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.06em;text-transform:uppercase}
.ap-main{padding:24px 32px 60px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.ap-top{width:100%;max-width:680px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.ap-top .btn svg{width:18px;height:18px}
.ap-card{width:100%;max-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
.ap-card h2{font-size:22px;font-weight:700}
.ap-card>p{margin:-10px 0 0}
.ap-prog{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);font-weight:600}.ap-prog .bar{flex:1}
.ap-err{margin:0;color:var(--bad);font-size:13px;font-weight:500}
.owner{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.doc{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);border-radius:12px;padding:12px}
.doc.done{border-style:solid;border-color:var(--line)}
.ic-box.good{background:var(--good-soft);color:var(--good)}
.rev{display:flex;flex-direction:column;gap:8px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:12px;position:relative;padding-bottom:16px}
.timeline li:not(:last-child)::before{content:'';position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li>span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);margin-top:1px}
.timeline li.done>span{background:var(--good);border-color:var(--good)}
.timeline li.on>span{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.timeline b{font-size:14px}.timeline p{margin:2px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:900px){.ap{grid-template-columns:minmax(0,1fr)}.ap-rail{position:static;height:auto;padding:24px 16px;gap:18px}.ap-rail h1{font-size:24px}.ap-steps{flex-direction:row;flex-wrap:wrap;gap:4px 14px}.ap-foot{display:none}.ap-main{padding:16px 16px 48px}.ap-card{padding:20px}}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:272px;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim.open{position:fixed;inset:0;background:rgba(6,10,20,.4);z-index:39}
  .top .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  main{padding:18px 16px 60px}
  .hero,.ref-hero,.g-2{grid-template-columns:minmax(0,1fr)}
  .hero-rates,.ref-hero .r{border-left:0;border-top:1px solid var(--line)}
  .top .search{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi .v{font-size:20px}
  .big{font-size:36px}
  .page-head h1{font-size:23px}
  .act{grid-template-columns:auto minmax(0,1fr)}
  .act .btns{grid-column:2;justify-content:flex-start}
  .form-grid,.fund-grid{grid-template-columns:minmax(0,1fr)}
  .statrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hbar{grid-template-columns:72px minmax(0,1fr) 70px}
  .addr{flex-direction:column;align-items:flex-start}
  .hide-sm{display:none}
  .top-right .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function qrSvg(seed){
 const n=25,r=rng([...seed].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7));let s='';
 const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0C1426"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0C1426"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;if(r()<.48)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-label="Deposit QR code (demo)"><g fill="#0C1426">${s}</g>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

  <div class="kv"><div class="k">Application ID</div><div class="v mono">APP-26-0918</div><div class="c"></div><div class="k">Business</div><div class="v">${esc(d.legal)}</div><div class="c"></div><div class="k">Submitted</div><div class="v">${fmtDT(TODAY)}</div><div class="c"></div></div>
  <ol class="timeline">${[['Submitted','Your application and documents are in.','done'],['Under review','We verify your business and owners, and may email you for more info.','on'],['Approved','You get an email with your login and starting limits.',''],['Fund your balance','Send a free wire or ACH, or load USDC/USDT at 1%.',''],['Issue your cards','Create unlimited virtual cards and invite your team.','']].map(([t,s,c])=>`<li class="${c}"><span></span><div><b>${t}</b><p>${s}</p></div></li>`).join('')}</ol>
  <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="apRestart">Start a new application</button><button class="btn primary" data-act="asRole:ez">See the approved dashboard</button></div></div>`}
 else main=`<div class="ap-card"><div class="ap-prog"><span>Step ${AP.step+1} of ${AP_STEPS.length}</span><div class="bar"><i style="width:${(AP.step+1)/AP_STEPS.length*100}%"></i></div></div>
  ${apStepBody()}
  <p class="ap-err" ${AP.err?'':'hidden'}>${esc(AP.err)}</p>
  <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:4px">${AP.step?`<button class="btn" data-act="apBack">Back</button>`:'<span class="muted" style="font-size:12.5px">Takes about 8 minutes</span>'}<button class="btn primary" data-act="apNext">${AP.step===AP_STEPS.length-1?'Submit application':'Continue'}</button></div></div>`;
 el.innerHTML=`<div class="ap">${rail}<main class="ap-main"><div class="ap-top"><span class="muted" style="font-size:13px">Already approved? <button class="link" data-act="asRole:ez">Log in</button></span><button class="btn ghost icon" data-act="theme" aria-label="Toggle theme">${$('#themeBtn').innerHTML}</button></div>${main}</main></div>`;
}

/* ============ render ============ */
const NAV=[['home','Home','home'],['action','Action Center','inbox'],['cards','Cards','card'],['transactions','Transactions','list'],['cash','Cash Account','bank'],['analytics','Analytics','chart'],['affiliate','Refer & earn','gift'],['team','Team','user'],['settings','Settings','shield']];
const ADMIN_ONLY=['cash','affiliate','team'];
const canSee=v=>isAdmin()||!ADMIN_ONLY.includes(v);
function applyRoleChrome(){const adm=isAdmin();$('#topFund').hidden=!adm;$('#topCreate').innerHTML=ico('card')+`<span class="lbl">${adm?'New card':'Request card'}</span>`;$('#promo').hidden=!adm;
 const m=ME();$('#meBox').innerHTML=`${avatar(m.id,true)}<div style="flex:1;min-width:0"><b>${esc(m.name)}</b><span>${adm?'Admin':'Media buyer'}</span></div>`;}
function withFocus(fn){const a=document.activeElement;const id=a&&a.id;let s,e;try{s=a.selectionStart;e=a.selectionEnd}catch(_){}
 fn();if(id){const n=document.getElementById(id);if(n&&n!==document.activeElement){n.focus({preventScroll:true});try{if(s!=null)n.setSelectionRange(s,e)}catch(_){}}}}
function renderNav(){const n=actionItems().length;
 $('#nav').innerHTML=`<div class="nav-label">Workspace</div>`+NAV.filter(([k])=>canSee(k)).map(([k,l,i])=>`<a href="#${k}" data-nav="${k}" class="${S.view===k?'on':''}"${S.view===k?' aria-current="page"':''}>${ico(i)}<span>${l}</span>${k==='action'&&n?`<span class="badge">${n}</span>`:''}</a>`).join('');
 $('#bellBtn').innerHTML=ico('bell')+(n?`<span style="position:absolute;margin:-14px 0 0 14px;width:8px;height:8px;border-radius:50%;background:var(--orange)"></span>`:'');}
function render(){const ap=S.as==='applicant';document.querySelector('.app').hidden=ap;$('#apply').hidden=!ap;if(ap){withFocus(renderApply);return}withFocus(()=>{renderNav();$('#main').innerHTML=VIEWS[S.view]();drawCharts()});}
function renderOv(){withFocus(()=>{$('#overlay').innerHTML=overlayHTML()});S.ovAnim=false;}
function go(v){if(!VIEWS[v]||!canSee(v))v='home';S.view=v;try{history.replaceState(null,'','#'+v)}catch(_){location.hash=v}closeSide();render();window.scrollTo(0,0)}
function openOv(o){S.ov=o;S.ovAnim=true;S.reveal=false;S.closeConfirm=false;S.editAddr=false;renderOv();document.body.style.overflow='hidden'}
function closeOv(){S.ov=null;$('#overlay').innerHTML='';document.body.style.overflow=''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=ico('check',2.4)+esc(msg);$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
function openSide(){$('#side').classList.add('open');$('#scrim').classList.add('open')}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
function copy(txt){const ok=()=>toast('Copied to clipboard');try{navigator.clipboard.writeText(txt).then(ok,()=>fallback())}catch(_){fallback()}
 function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){toast('Select and copy: '+txt)}ta.remove()}}
function refreshAll(){render();if(S.ov)renderOv()}

/* ============ events ============ */
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();go(nav.dataset.nav);return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const [act,arg]=el.dataset.act.split(/:(.*)/s);
 switch(act){
  case 'openSide':openSide();break; case 'closeSide':closeSide();break;
  case 'theme':{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('ac-theme',nx)}catch(_){}setThemeIcon();if(S.as==='applicant')render();requestAnimationFrame(drawCharts);break}
  case 'go':closeOv();go(arg);break;
  case 'addFunds':openOv({type:'fund'});break;
  case 'createCard':openOv({type:'create'});break;
  case 'withdraw':openOv({type:'withdraw'});break;
  case 'kyb':openOv({type:'kyb'});break;
  case 'kybDone':RESOLVED.add('kyb');closeOv();refreshAll();toast('Beneficial owners confirmed');break;
  case 'closeOv':closeOv();break;
  case 'openCard':S.ov=null;openOv({type:'card',id:arg});break;
  case 'openTx':openOv({type:'tx',id:arg});break;
  case 'reveal':S.reveal=!S.reveal;renderOv();break;
  case 'freeze':C(arg).status='frozen';refreshAll();toast('Card frozen — new charges will decline');break;
  case 'unfreeze':C(arg).status='active';TX.filter(t=>t.cardId===arg&&t.reason==='Card frozen').forEach(t=>RESOLVED.add('dec_'+t.id));refreshAll();toast('Card unfrozen');break;
  case 'saveLimit':{const v=parseFloat($('#lim-'+arg).value.replace(/[^\d.]/g,''));if(!(v>0)){toast('Enter a limit above $0');break}const c=C(arg);c.limit=v;c.period=$('#per-'+arg).value;TX.filter(t=>t.cardId===arg&&t.reason==='Card limit reached').forEach(t=>RESOLVED.add('dec_'+t.id));refreshAll();toast(`Limit set to ${money0(v)} ${c.period==='daily'?'per day':c.period==='monthly'?'per month':'lifetime'}`);break}
  case 'toggleLock':{const c=C(arg);c.lock=!c.lock;refreshAll();toast(c.lock?`Locked to ${c.platform}`:'Platform lock turned off');break}
  case 'addrEdit':S.editAddr=true;renderOv();break;
  case 'addrCancel':S.editAddr=false;renderOv();break;
  case 'addrSave':{const c=C(arg);c.addr={line1:$('#ea-a1').value.trim(),city:$('#ea-city').value.trim(),state:$('#ea-state').value.trim(),zip:$('#ea-zip').value.trim(),country:'United States'};S.editAddr=false;renderOv();toast('Billing address updated');break}
  case 'setTab':S.set.tab=arg;render();break;
  case 'saveBiz':BIZ.dba=$('#bz-dba').value.trim();BIZ.email=$('#bz-email').value.trim();BIZ.addr={line1:$('#bz-a1').value.trim(),city:$('#bz-city').value.trim(),state:$('#bz-state').value.trim(),zip:$('#bz-zip').value.trim(),country:'United States'};render();toast('Business profile saved');break;
  case 'acctOn':S.acct[arg]={last:'just now'};render();toast(`${arg==='qb'?'QuickBooks':'Xero'} connected — first sync started`);break;
  case 'acctOff':S.acct[arg]=null;render();toast('Disconnected');break;
  case 'syncNow':S.acct[arg].last='just now';render();toast('Synced');break;
  case 'exportCsv':openOv({type:'export'});break;
  case 'doExport':{const n=exportRows().length;closeOv();toast(`CSV with ${n} transactions is ready — we also emailed it to ${ME().email}`);break}
  case 'stmt':toast(`${arg} statement opens as a PDF in the live app`);break;
  case 'apNext':{AP.err=apValidate();if(AP.err){render();break}if(AP.step===AP_STEPS.length-1){AP.submitted=true}else AP.step++;render();window.scrollTo(0,0);break}
  case 'apBack':AP.err='';AP.step=Math.max(0,AP.step-1);render();window.scrollTo(0,0);break;
  case 'apGo':AP.err='';AP.step=+arg;render();window.scrollTo(0,0);break;
  case 'apChip':{const [k,v]=arg.split('|');const a=AP.d[k];a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);render();break}
  case 'apAddOwner':AP.d.owners.push({name:'',title:'',pct:'',email:''});render();break;
  case 'apDelOwner':AP.d.owners.splice(+arg,1);render();break;
  case 'apRestart':AP.submitted=false;AP.step=0;AP.err='';AP.d.terms=false;render();break;
  case 'closeAsk':S.closeConfirm=true;renderOv();break;
  case 'closeCancel':S.closeConfirm=false;renderOv();break;
  case 'closeCard':C(arg).status='closed';S.closeConfirm=false;refreshAll();toast('Card closed');break;
  case 'dismiss':RESOLVED.add(arg);render();toast('Dismissed');break;
  case 'approve':{const r=REQUESTS.find(x=>x.id===arg);RESOLVED.add(arg);
   if(r.type==='card'){for(let i=0;i<r.qty;i++)CARDS.unshift({id:'n'+Date.now()+i,name:r.qty>1?`${r.name} #${i+1}`:r.name,platform:r.platform,acct:r.acct,member:r.member,limit:r.limit,period:r.period,status:'active',lock:r.lock!==false,addr:r.addr||{...BIZ.addr},last4:String(Math.floor(1000+Math.random()*9000)),created:new Date(TODAY)});render();toast(`Issued — ${M(r.member).name} can use ${r.name} now`);break}
   C(r.cardId).limit=r.to;render();toast(`Approved — ${C(r.cardId).name} is now ${money0(r.to)}/mo`);break}
  case 'requestLimit':{const v=parseFloat($('#rq-'+arg).value.replace(/[^\d.]/g,''));const c=C(arg);if(!(v>c.limit)){toast('Ask for more than the current limit of '+money0(c.limit));break}
   REQUESTS.push({id:'rq'+Date.now(),type:'limit',member:S.as,cardId:arg,to:v,note:$('#rqn-'+arg).value.trim()||'No note',date:new Date(TODAY)});refreshAll();toast('Request sent to your admins');break}
  case 'asRole':if(arg==='applicant'){S.as='applicant';closeOv();$('#viewAs').value='applicant';render();window.scrollTo(0,0);break}$('#viewAs').value=arg;S.as=arg;S.ac.tab='all';S.tx.member='all';S.cards.group='none';closeOv();applyRoleChrome();go(canSee(S.view)?S.view:'home');toast(`Viewing as ${ME().name} · ${isAdmin()?'Admin':'Media buyer'}`);break;
  case 'inviteMember':toast('Invite flow goes here — email plus role (Admin or Media buyer)');break;
  case 'deny':RESOLVED.add(arg);render();toast(isAdmin()?`Request declined — ${M(REQUESTS.find(x=>x.id===arg).member).name} will be notified`:'Request cancelled');break;
  case 'acTab':S.ac.tab=arg;render();break;
  case 'cardStatus':S.cards.status=arg;render();break;
  case 'moreTx':S.tx.limit+=25;render();break;
  case 'anRange':S.an.range=+arg;render();break;
  case 'fTab':S.fund.tab=arg;renderOv();break;
  case 'fAsset':S.fund.asset=arg;S.fund.network=NETWORKS[arg][0][0];S.ov?renderOv():render();break;
  case 'fNet':S.fund.network=arg;S.ov?renderOv():render();break;
  case 'sentCrypto':closeOv();toast(`We'll credit your balance once the ${S.fund.asset} deposit confirms`);break;
  case 'copy':copy(arg);break;
  case 'submitCreate':{
   const name=$('#cc-name').value.trim();if(!name){$('#cc-err').hidden=false;$('#cc-name').focus();break}
   const qty=Math.min(50,Math.max(1,parseInt($('#cc-qty').value)||1));const lock=$('#cc-lock').checked,addr={line1:$('#cc-a1').value.trim(),city:$('#cc-city').value.trim(),state:$('#cc-state').value.trim(),zip:$('#cc-zip').value.trim(),country:'United States'};const lim=parseFloat($('#cc-lim').value.replace(/[^\d.]/g,''))||1000;
   if(!isAdmin()){REQUESTS.push({id:'rq'+Date.now(),type:'card',member:S.as,lock,addr,name,platform:$('#cc-plat').value,acct:$('#cc-acct').value.trim()||'Unassigned',limit:lim,period:$('#cc-per').value,qty,note:$('#cc-note').value.trim()||'No note',date:new Date(TODAY)});closeOv();render();toast('Request sent to your admins');break}
   for(let i=0;i<qty;i++)CARDS.unshift({id:'n'+Date.now()+i,name:qty>1?`${name} #${i+1}`:name,platform:$('#cc-plat').value,acct:$('#cc-acct').value.trim()||'Unassigned',member:$('#cc-mem').value,limit:lim,period:$('#cc-per').value,status:'active',lock,addr,last4:String(Math.floor(1000+Math.random()*9000)),created:new Date(TODAY)});
   closeOv();S.cards.status='active';go('cards');toast(qty>1?`${qty} cards created`:'Card created');break}
  case 'submitWithdraw':{const v=parseFloat($('#wd-amt').value.replace(/[^\d.]/g,''));if(!(v>0)||v>BALANCE){toast(v>BALANCE?'That’s more than your available balance':'Enter an amount above $0');break}
   BALANCE-=v;DEPOSITS.unshift({id:'w'+Date.now(),date:new Date(TODAY),method:'Refund',network:$('#wd-to').value+' · '+$('#wd-why').value,gross:-v,status:'pending',conf:'Under review'});closeOv();render();toast(`Refund request for ${money(v)} sent`);break}
  case 'invite':toast('Invite flow goes here — sends your referral link by email');break;
  case 'dispute':toast('Dispute started — we’ll follow up by email');break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.dataset.ap){AP.d[e.target.dataset.ap]=e.target.value;return}
 if(e.target.dataset.owner){const [i,k]=e.target.dataset.owner.split('.');AP.d.owners[+i][k]=e.target.value;return}
 const f=e.target.dataset.f;if(!f)return;
 if(f==='refCalc'){S.refCalc=e.target.value;render();return}
 const [grp,key]=f.split('.');S[grp][key]=e.target.value;
 if(grp==='tx')S.tx.limit=25;
 if(grp==='fund'){S.ov?renderOv():render();return}
 render();
});
document.addEventListener('change',e=>{
 if(e.target.dataset.apcheck){AP.d[e.target.dataset.apcheck]=e.target.checked;if(e.target.dataset.apcheck==='ownersOk')render();return}
 if(e.target.dataset.doc){const f=e.target.files&&e.target.files[0];if(f){AP.d.docs[e.target.dataset.doc]=f.name;AP.err='';render();toast('Uploaded '+f.name)}return}
 if(e.target.dataset.ap){AP.d[e.target.dataset.ap]=e.target.value;return}
 if(e.target.dataset.notif){(NOTIF[S.as]=NOTIF[S.as]||{})[e.target.dataset.notif]=e.target.checked;toast('Notification preference saved');return}
 if(e.target.id==='viewAs'){document.querySelector('[data-act]');const b=document.createElement('button');b.dataset.act='asRole:'+e.target.value;b.hidden=true;document.body.appendChild(b);b.click();b.remove();return}
 const r=e.target.dataset.role;if(r){M(r).access=e.target.value;toast(`${M(r).name} is now ${e.target.value==='admin'?'an Admin':'a Media buyer'}`);const o=document.querySelector('#viewAs option[value="'+r+'"]');if(o)o.textContent=M(r).name+' · '+(e.target.value==='admin'?'Admin':'Media buyer')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.ov)closeOv();else closeSide()}
 if(e.key==='Enter'&&e.target.closest('#createForm')){e.preventDefault();document.querySelector('[data-act="submitCreate"]').click()}});
document.addEventListener('submit',e=>e.preventDefault());
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){S.tx.q=e.target.value;S.tx.range='all';S.tx.limit=25;go('transactions');e.target.value=''}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,120)});

function setThemeIcon(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');$('#themeBtn').innerHTML=ico(cur==='dark'?'sun':'moon')}
(function init(){
 try{const t=localStorage.getItem('ac-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
 $('#menuBtn').innerHTML=ico('menu');$('#searchIcon').outerHTML=ico('search');
 $('#topCreate').innerHTML=ico('card')+'<span class="lbl">New card</span>';$('#topFund').innerHTML=ico('plus')+'<span class="lbl">Add funds</span>';
 $('#bellBtn').style.position='relative';
 setThemeIcon();
 applyRoleChrome();const h=(location.hash||'').slice(1);if(h==='apply'){S.as='applicant';$('#viewAs').value='applicant';render();return}S.view=VIEWS[h]&&canSee(h)?h:'home';render();
})();
</script>
